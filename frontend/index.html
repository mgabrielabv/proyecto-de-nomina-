<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0C0D" />
    <meta name="description" content="Onyx, la plataforma moderna para el pago de nómina." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231C1917'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23FAFAF9' stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <title>Onyx — Acceso</title>
    <script>
      (function () {
        try {
          var key = 'onyx-theme';
          var stored = localStorage.getItem(key);
          var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
